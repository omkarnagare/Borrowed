<ion-header translucent>
  <ion-toolbar color="primary">
    <ion-title>
      Add Lent Item
    </ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="redirectToHomePage()">
        <ion-icon slot="icon-only" name="close"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content fullscreen>

  <ion-card no-margin>
    <ion-card-content>
      <form [formGroup]="itemDetailsFormGroup">
        <div *ngIf="isMobilePlatform">
          <ion-item lines="none">
            <ion-avatar class="item-picture">
              <ion-img [src]="itemImage">
              </ion-img>
            </ion-avatar>
          </ion-item>
          <ion-item lines="none">
            <ion-chip (click)="selectImageSource()" class="center-chip">
              <ion-icon name="camera"></ion-icon>
              <ion-label> {{ itemImage ? "Change Image" : "Add Image (Optional)" }}</ion-label>
            </ion-chip>
          </ion-item>
        </div>
        <ion-item>
          <ion-input placeholder="Item Name/Category" formControlName="itemName" type="text"></ion-input>
        </ion-item>
        <div *ngFor="let validation of validationMessages.itemName" class="validation-errors">
          <ion-item class="error-message" *ngIf="isError('itemName', validation.type)">
            <ion-icon name="alert"></ion-icon>
            <ion-label>{{ validation.message }}</ion-label>
          </ion-item>
        </div>
        <ion-item>
          <ion-label>Borrowing Date</ion-label>
          <ion-datetime [max]="today" displayFormat="DD MMM YYYY" formControlName="borrowingDate"
            placeholder="Date Given">
          </ion-datetime>
        </ion-item>
        <div *ngFor="let validation of validationMessages.borrowingDate" class="validation-errors">
          <ion-item class="error-message" *ngIf="isError('borrowingDate', validation.type)">
            <ion-icon name="alert"></ion-icon>
            <ion-label>{{ validation.message }}</ion-label>
          </ion-item>
        </div>
        <ion-item *ngIf="isMobilePlatform" lines="none">
          <ion-searchbar formControlName="searchQuery" (ionChange)="searchForContacts()" searchIcon="contacts"
            placeholder="browse from contact list" autocomplete="on" debounce="700">
          </ion-searchbar>
        </ion-item>
        <ion-item *ngIf="contactsFound && contactsFound.length !== 0" lines="none">
          <ion-list class="container">
            <div *ngFor="let contact of contactsFound">
              <ion-item lines="none">
                <ion-label style="font-size: 12px;">
                  {{ contact?.displayName }}
                </ion-label>
              </ion-item>
              <ion-item lines="none">
                <div class="scroll" scrollX="true">
                  <!-- <ion-chip>{{ contact?.displayName }}</ion-chip> -->
                  <ion-chip *ngFor="let number of contact?.phoneNumbers"
                    (click)="assignContactDetails(contact, number.value)">
                    <ion-icon style="color:rgb(1, 112, 41)" name="code-download"></ion-icon>
                    <ion-label color="primary">{{ number.value }}</ion-label>
                  </ion-chip>
                </div>
              </ion-item>
            </div>
          </ion-list>
        </ion-item>
        <ion-item>
          <ion-input placeholder="Lendee" formControlName="lendeeName" type="text"></ion-input>
        </ion-item>
        <div *ngFor="let validation of validationMessages.lendeeName" class="validation-errors">
          <ion-item class="error-message" *ngIf="isError('lendeeName', validation.type)">
            <ion-icon name="alert"></ion-icon>
            <ion-label>{{ validation.message }}</ion-label>
          </ion-item>
        </div>
        <ion-item>
          <ion-input placeholder="Contact Number For Lendee" formControlName="lendeeContact" type="text"></ion-input>
        </ion-item>
        <div *ngFor="let validation of validationMessages.lendeeContact" class="validation-errors">
          <ion-item class="error-message" *ngIf="isError('lendeeContact', validation.type)">
            <ion-icon name="alert"></ion-icon>
            <ion-label>{{ validation.message }}</ion-label>
          </ion-item>
        </div>
        <ion-item>
          <ion-input placeholder="Email For Lendee" formControlName="lendeeEmail" type="text"></ion-input>
        </ion-item>
        <div *ngFor="let validation of validationMessages.lendeeEmail" class="validation-errors">
          <ion-item class="error-message" *ngIf="isError('lendeeEmail', validation.type)">
            <ion-icon name="alert"></ion-icon>
            <ion-label>{{ validation.message }}</ion-label>
          </ion-item>
        </div>
        <ion-item lines="none">
          <ion-label>Urgent</ion-label>
          <ion-toggle formControlName="isUrgent" checked="false"></ion-toggle>
        </ion-item>
        <ion-item>
          <ion-textarea placeholder="Add something more about the item here" formControlName="itemDescription">
          </ion-textarea>
        </ion-item>

        <ion-button (click)="addItem()" [disabled]="itemDetailsFormGroup.invalid" class="expand-button">
          Add</ion-button>
        <!-- <ion-button (click)="closeModal()" class="expand-button">
          Cancel</ion-button> -->
      </form>
    </ion-card-content>
  </ion-card>

</ion-content>
