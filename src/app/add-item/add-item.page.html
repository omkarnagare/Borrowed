<ion-content>

  <ion-card no-margin>
    <ion-card-content>
      <form [formGroup]="itemDetailsFormGroup">
        <ion-item lines="none">
          <ion-avatar class="item-picture">
            <ion-img [src]="itemImage">
            </ion-img>
          </ion-avatar>
        </ion-item>
        <ion-item lines="none">
          <ion-chip (click)="selectImageSource()" class="center-chip">
            <ion-icon name="camera" color="primary"></ion-icon>
            <ion-label> {{ itemImage ? "Change Image" : "Add Image (Optional)" }}</ion-label>
          </ion-chip>
        </ion-item>
        <ion-item>
          <ion-input placeholder="Item Name/Category" formControlName="itemName" type="text"></ion-input>
        </ion-item>
        <ion-item>
          <ion-label>Given Date</ion-label>
          <ion-datetime displayFormat="DD MMM YYYY" formControlName="dateBorrowed" placeholder="Date Given"></ion-datetime>
        </ion-item>
        <!-- <ion-item>
          <ion-input placeholder="Given Date" formControlName="dateBorrowed" type="text"></ion-input>
        </ion-item> -->
        <ion-item lines="none">
          <ion-label>Urgent</ion-label>
          <ion-toggle color="danger" formControlName="isUrgent" checked="false"></ion-toggle>
        </ion-item>
        <ion-item>
          <ion-textarea placeholder="Enter more information here..." formControlName="itemDescription">
          </ion-textarea>
        </ion-item>

        <ion-button (click)="addItem()" [disabled]="itemDetailsFormGroup.invalid" margin-top expand="full">
          Add</ion-button>
        <ion-button (click)="closeModal()" color="danger" margin-top expand="full">
          Cancel</ion-button>
      </form>
    </ion-card-content>
  </ion-card>

  <!-- <ion-fab vertical="bottom" horizontal="start" slot="fixed">

  <ion-fab vertical="bottom" horizontal="end" slot="fixed">
    <ion-fab-button>
      <ion-icon color="danger" name="close"></ion-icon>
    </ion-fab-button>
  </ion-fab> -->

</ion-content>
