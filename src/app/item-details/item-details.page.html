<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button></ion-back-button>
    </ion-buttons>
    <ion-title></ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="toggleUrgentStatus()">
        <ion-icon *ngIf="itemObject.isUrgent" color="success" name="star"></ion-icon>
        <ion-icon *ngIf="!itemObject.isUrgent" color="success" name="star-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>

  <div *ngIf="!itemObject.itemName">
    <ion-card>
      <ion-skeleton-text class="skeleton-image" animated></ion-skeleton-text>
      <ion-card-header>
        <!-- <ion-card-subtitle>
          <ion-skeleton-text animated></ion-skeleton-text>
        </ion-card-subtitle> -->
        <ion-card-title>
          <ion-skeleton-text animated></ion-skeleton-text>
        </ion-card-title>
      </ion-card-header>
      <ion-card-content>
        <ion-skeleton-text animated></ion-skeleton-text>
        <ion-skeleton-text animated></ion-skeleton-text>
      </ion-card-content>
    </ion-card>

    <ion-card>
      <ion-list lines="none">
        <ion-item *ngFor="let x of [1]">
          <ion-skeleton-text animated></ion-skeleton-text>
        </ion-item>
      </ion-list>
    </ion-card>
  </div>

  <div *ngIf="itemObject.itemName">
    <ion-avatar class="item-image" *ngIf="itemObject.itemImage">
      <ion-img [src]="itemObject.itemImage" class="item-image"></ion-img>
    </ion-avatar>

    <ion-card no-margin class="card-center">
      <ion-card-header>
        <!-- <ion-card-subtitle></ion-card-subtitle> -->
        <ion-card-title>{{ itemObject.itemName }}</ion-card-title>
      </ion-card-header>
      <ion-card-content>
        <p>{{ itemObject.itemDescription }}</p>
      </ion-card-content>
    </ion-card>

    <ion-card class="card-center">
      <ion-list lines="none">
        <ion-item *ngIf="itemObject.borrowingDate" >
          <ion-chip color="primary">Lent on : </ion-chip>
          <ion-chip color="success">{{ itemObject.borrowingDate  | date: 'dd-MMM-yyyy HH:mm' }}</ion-chip>
        </ion-item>
        <ion-item *ngIf="itemObject.lendeeName" >
          <ion-chip color="primary">Lent To : </ion-chip>
          <ion-chip color="success">{{ itemObject.lendeeName }}</ion-chip>
        </ion-item>
        <ion-item *ngIf="itemObject.lendeeContact" >
          <ion-chip color="primary">Lendee Contact : </ion-chip>
          <ion-chip color="success">{{ itemObject.lendeeContact }}</ion-chip>
        </ion-item>
      </ion-list>
    </ion-card>
  </div>

</ion-content>
