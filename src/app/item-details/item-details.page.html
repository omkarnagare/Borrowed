<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button></ion-back-button>
    </ion-buttons>
    <ion-title></ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="toggleUrgentStatus()">
        <ion-icon *ngIf="(itemDetails | async)?.isUrgent" color="success" name="star"></ion-icon>
        <ion-icon *ngIf="!(itemDetails | async)?.isUrgent" color="success" name="star-outline"></ion-icon>
      </ion-button>
      <ion-button (click)="removeItem()">
        <ion-icon color="danger" name="trash"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>

  <div *ngIf="!itemDetails">
    <ion-card>
      <ion-skeleton-text class="skeleton-image" animated></ion-skeleton-text>
      <ion-card-header>
        <!-- <ion-card-subtitle>
          <ion-skeleton-text animated></ion-skeleton-text>
        </ion-card-subtitle> -->
        <ion-card-title>
          <ion-skeleton-text animated></ion-skeleton-text>
        </ion-card-title>
      </ion-card-header>
      <ion-card-content>
        <ion-skeleton-text animated></ion-skeleton-text>
        <ion-skeleton-text animated></ion-skeleton-text>
      </ion-card-content>
    </ion-card>

    <ion-card>
      <ion-list lines="none">
        <ion-item *ngFor="let x of [1]">
          <ion-skeleton-text animated></ion-skeleton-text>
        </ion-item>
      </ion-list>
    </ion-card>
  </div>

  <div *ngIf="itemDetails">
    <ion-avatar class="item-image">
      <ion-img [src]="(itemDetails | async)?.itemImage" class="item-image"></ion-img>
    </ion-avatar>

    <ion-card no-margin class="card-center">
      <ion-card-header>
        <!-- <ion-card-subtitle></ion-card-subtitle> -->
        <ion-card-title>{{ (itemDetails | async)?.itemName }}</ion-card-title>
      </ion-card-header>
      <ion-card-content>
        <p>{{ (itemDetails | async)?.itemDescription }}</p>
      </ion-card-content>
    </ion-card>

    <ion-card class="card-center">
      <ion-list lines="none">
        <ion-item>
          <ion-chip color="primary">Item Given on : </ion-chip>
          <ion-chip color="success">{{ (itemDetails | async)?.dateBorrowed  | date: 'dd-MMM-yyyy HH:mm' }}</ion-chip>
        </ion-item>
      </ion-list>
    </ion-card>
  </div>

</ion-content>
