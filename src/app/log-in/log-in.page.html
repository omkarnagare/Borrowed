<ion-header>
  <ion-toolbar>
    <ion-title>LogIn</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-card>
    <ion-card-content>
      <form [formGroup]="logInFormGroup">
        <ion-item>
          <ion-label>Email: </ion-label>
          <ion-input formControlName="email" type="email"></ion-input>
        </ion-item>

        <ion-item>
          <ion-label>Password: </ion-label>
          <ion-input formControlName="password" type="password"></ion-input>
        </ion-item>

        <ion-button 
        (click)="logIn()"
        [disabled]="logIn.invalid" margin-top expand="full">
          LogIn</ion-button>
      </form>
    </ion-card-content>
  </ion-card>
</ion-content>
