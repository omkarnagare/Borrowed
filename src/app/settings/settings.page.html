<ion-header translucent>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-back-button></ion-back-button>
    </ion-buttons>
    <ion-title>
      Settings
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content fullscreen>
  <div *ngIf="showSettingsMenu">
    <ion-list>
      <ion-item @sliderighttitle routerLink="faqs">
        <ion-icon style="color:black" slot="start" name="help"></ion-icon>
        <ion-label>FAQs</ion-label>
      </ion-item>
      <ion-item @slidelefttitle routerLink="theme-controller">
        <ion-icon style="color:#8a3ab9" slot="start" name="color-palette"></ion-icon>
        <ion-label>Themes</ion-label>
        <!-- <ion-icon slot="end" name="arrow-dropright"></ion-icon> -->
      </ion-item>
      <ion-item @sliderighttitle routerLink="privacy-policy">
        <ion-icon style="color: red" slot="start" name="finger-print"></ion-icon>
        <ion-label>Privacy Policy</ion-label>
      </ion-item>
      <ion-item @slidelefttitle routerLink="terms-and-conditions">
        <ion-icon style="color: red" slot="start" name="document"></ion-icon>
        <ion-label>Terms And Conditions</ion-label>
      </ion-item>
      <ion-item @sliderighttitle *ngIf="isMobilePlatform" (click)="share()">
        <ion-icon style="color: #25D366" slot="start" name="share"></ion-icon>
        <ion-label>Share with World</ion-label>
      </ion-item>
      <ion-item @slidelefttitle routerLink="contact-us">
        <ion-icon style="color: orange" slot="start" name="contacts"></ion-icon>
        <ion-label>Contact us</ion-label>
      </ion-item>
      <ion-item @sliderighttitle routerLink="about-dev">
        <ion-icon style="color:blue" slot="start" name="logo-freebsd-devil"></ion-icon>
        <ion-label>About Developer</ion-label>
      </ion-item>
      <ion-item @slidelefttitle>
        v{{ appVersion }}
      </ion-item>
    </ion-list>
  </div>

</ion-content>
