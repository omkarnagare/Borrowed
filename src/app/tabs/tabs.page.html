<ion-tabs>

  <ion-tab-bar slot="bottom">
    <ion-tab-button layout="label-hide" tab="borrowed">
      <ion-icon name="home"></ion-icon>
      <ion-label>Home</ion-label>
    </ion-tab-button>

    <ion-tab-button layout="label-hide" tab="urgent-items">
      <ion-icon name="star"></ion-icon>
      <ion-label>Urgent</ion-label>
    </ion-tab-button>

    <ion-tab-button layout="label-hide" tab="add-item">
      <ion-icon name="add" class="large-icon-with-border"></ion-icon>
      <ion-label>Add Item</ion-label>
    </ion-tab-button>

    <ion-tab-button layout="label-hide" tab="account">
      <ion-icon name="person"></ion-icon>
      <ion-label>Account</ion-label>
    </ion-tab-button>

    <ion-tab-button layout="label-hide" tab="settings">
      <ion-icon name="settings"></ion-icon>
      <ion-label>Settings</ion-label>
    </ion-tab-button>
  </ion-tab-bar>

</ion-tabs>
