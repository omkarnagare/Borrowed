<ion-header>
  <ion-toolbar>
    <ion-title>
      Urgent Items
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>

  <div *ngIf="!urgentMissingItems">
    <ion-card *ngFor="let x of [1, 2, 3, 4]">
      <ion-skeleton-text class="skeleton-image" animated></ion-skeleton-text>
      <ion-card-header>
        <ion-card-subtitle>
          <ion-skeleton-text animated></ion-skeleton-text>
        </ion-card-subtitle>
        <ion-card-title>
          <ion-skeleton-text animated></ion-skeleton-text>
        </ion-card-title>
      </ion-card-header>
      <ion-card-content>
        <ion-skeleton-text animated></ion-skeleton-text>
        <ion-skeleton-text animated></ion-skeleton-text>
      </ion-card-content>
    </ion-card>
  </div>

  <!-- <ion-card [routerLink]="['item-details', urgentMissingItem.itemId]" button class="welcome-card"
        *ngFor="let urgentMissingItem of (urgentMissingItems | async)">
        <img [src]="urgentMissingItem.itemImage" alt="/assets/shapes.svg" />
        <ion-card-header>
          <ion-card-subtitle>{{ urgentMissingItem.itemDescription }}</ion-card-subtitle>
          <ion-card-title>{{ urgentMissingItem.itemName }}</ion-card-title>
        </ion-card-header>
        <ion-card-content>
          <p>No items added yet.</p>
          <p>Add items which people borrowed from you recently.</p>
        </ion-card-content>
      </ion-card> -->


  <ion-list>
    <ion-item-sliding [routerLink]="['item-details', urgentMissingItem.itemId]"
      *ngFor="let urgentMissingItem of (urgentMissingItems | async)">
      <ion-item-options side="start">
        <ion-item-option color="danger" (click)="removeItem( urgentMissingItem.itemId )">
          <ion-icon name="trash" slot="icon-only"></ion-icon>
        </ion-item-option>
      </ion-item-options>

      <ion-item>
        <ion-label> {{ urgentMissingItem.itemName }} </ion-label>
      </ion-item>
    </ion-item-sliding>
  </ion-list>

</ion-content>
