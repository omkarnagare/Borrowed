<ion-header translucent>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-back-button></ion-back-button>
    </ion-buttons>
    <ion-title>
      Contact Us
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content fullscreen>

  <div *ngIf="isMobilePlatform === null">
    <ion-card>
      <ion-card-header>
        <ion-card-title>
          <ion-skeleton-text animated></ion-skeleton-text>
        </ion-card-title>
        <ion-card-subtitle>
          <ion-skeleton-text animated></ion-skeleton-text>
          <ion-skeleton-text animated></ion-skeleton-text>
        </ion-card-subtitle>
      </ion-card-header>
      <ion-card-content>
        <ion-skeleton-text animated></ion-skeleton-text>
        <ion-skeleton-text animated></ion-skeleton-text>
        <ion-skeleton-text animated></ion-skeleton-text>
        <ion-skeleton-text animated></ion-skeleton-text>
      </ion-card-content>
    </ion-card>
  </div>

  <form [formGroup]="contactUsFormGroup" *ngIf="isMobilePlatform === true">
    <ion-card>
      <ion-card-header>
        <ion-card-title @slidetoptitle>Facing issue with Borrowed??</ion-card-title>
        <ion-card-subtitle @slidebottomtitle>
          <p>Don't worry, We are here to help you.</p>
          <p>Fill in the following details.</p>
        </ion-card-subtitle>
      </ion-card-header>
      <ion-card-content>
        <div>
          <ion-item @slidelefttitle>
            <ion-input placeholder="What happened" formControlName="subject" type="text"></ion-input>
          </ion-item>

          <div *ngFor="let validation of validationMessages.subject" class="validation-errors">
            <ion-item class="error-message" *ngIf="isError('subject', validation.type)">
              <ion-icon name="alert"></ion-icon>
              <ion-label>{{ validation.message }}</ion-label>
            </ion-item>
          </div>
        </div>
        <div>
          <ion-item @sliderighttitle>
            <ion-textarea placeholder="Describe your issue here" formControlName="body" type="text"></ion-textarea>
          </ion-item>

          <div *ngFor="let validation of validationMessages.body" class="validation-errors">
            <ion-item class="error-message" *ngIf="isError('body', validation.type)">
              <ion-icon name="alert"></ion-icon>
              <ion-label>{{ validation.message }}</ion-label>
            </ion-item>
          </div>
        </div>


        <ion-button @slidebottomtitle [disabled]="!contactUsFormGroup.valid" (click)="showAlertForSendingEmail()"
          class="expand-button">
          Send</ion-button>
      </ion-card-content>
    </ion-card>
  </form>

  <div *ngIf="isMobilePlatform === false">
    <ion-card>
      <ion-card-header>
        <ion-card-title @slidetoptitle>Facing issue with Todos??</ion-card-title>
        <ion-card-subtitle @slidebottomtitle>
          <p>Don't worry, We are here to help you.</p>
          <p> Support Email: <br> <b>{{ supportEmail }}</b>
          </p>
        </ion-card-subtitle>
      </ion-card-header>
    </ion-card>
  </div>

</ion-content>
