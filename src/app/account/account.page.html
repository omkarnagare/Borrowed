<ion-content fullscreen>

  <ion-card>
    <ion-card-content>

      <div *ngIf="!storedUserProfile">
        <ion-grid>
          <ion-row>
            <ion-col size="6">
              <div style="width: 100%; height: 100%;">
                <ion-skeleton-text class="skeleton-image" animated></ion-skeleton-text>
              </div>
            </ion-col>
            <ion-col size="6">
              <ion-skeleton-text animated></ion-skeleton-text>
              <ion-skeleton-text animated></ion-skeleton-text>
            </ion-col>
          </ion-row>
        </ion-grid>
        <ion-skeleton-text animated></ion-skeleton-text>
      </div>


      <div *ngIf="(storedUserProfile | async) as userProfile">
        <ion-grid>
          <ion-row>
            <ion-col size="6">
              <div style="width: 100%; height: 100%;">
                <ion-avatar class="profile-picture">
                  <ion-img [src]="userProfile.profileImage">
                  </ion-img>
                  <ion-icon (click)="selectImageSource()" color="success" class="camera-button" name="camera">
                  </ion-icon>
                </ion-avatar>
              </div>
            </ion-col>
            <ion-col size="6" class="bold-heading" style="text-align:center; padding: auto; margin: auto;">
              <ion-label>
                <h2 text-uppercase>{{ userProfile.name }}</h2>
              </ion-label>
            </ion-col>
          </ion-row>
        </ion-grid>
      </div>

      <ion-item *ngIf="(storedUserProfile | async)?.email as email">
        <ion-icon slot="start" name="mail"></ion-icon>
        <ion-label>{{ email }}</ion-label>
      </ion-item>

      <ion-item routerLink="/tabs/borrowed">
        <ion-label>Items Given</ion-label>
        <ion-badge color="success" slot="end">{{ (lentItems | async)?.length }}</ion-badge>
        <ion-icon slot="end" name="arrow-dropright"></ion-icon>
      </ion-item>

      <ion-item routerLink="/tabs/urgent-items">
        <ion-label>Urgent Items</ion-label>
        <ion-badge color="danger" slot="end">{{ (urgentMissingItems | async)?.length }}</ion-badge>
        <ion-icon slot="end" name="arrow-dropright"></ion-icon>
      </ion-item>

    </ion-card-content>
  </ion-card>
</ion-content>
