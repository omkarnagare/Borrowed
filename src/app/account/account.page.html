<ion-header translucent>
  <ion-toolbar color="primary">
    <!-- <ion-buttons slot="start">
      <ion-button (click)="shareToSocialNetworks()">
        <ion-icon slot="icon-only" color="primary" name="share"></ion-icon>
      </ion-button>
    </ion-buttons> -->
    <ion-title>
      Account
    </ion-title>
    <ion-buttons slot="end">
      <ion-button routerLink="user-activity">
        <ion-icon slot="icon-only" name="filing"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content fullscreen>
  <div *ngIf="showAccountDetails" @fadein>

    <form [formGroup]="userInfoFormGroup">
      <ion-card>
        <ion-card-header>
          <ion-card-subtitle>Account Details</ion-card-subtitle>
        </ion-card-header>
        <ion-card-content>

          <div *ngIf="userProfile === null">
            <ion-grid fixed>
              <ion-row>
                <ion-col size="12">
                  <div style="width: 100%; height: 100%;">
                    <ion-skeleton-text class="skeleton-image" animated></ion-skeleton-text>
                  </div>
                </ion-col>
              </ion-row>
            </ion-grid>
            <ion-skeleton-text animated></ion-skeleton-text>
            <ion-skeleton-text animated></ion-skeleton-text>
            <ion-skeleton-text animated></ion-skeleton-text>
          </div>


          <div *ngIf="userProfile !== null">
            <ion-grid fixed>
              <ion-row *ngIf="isMobilePlatform">
                <ion-col size="12">
                  <div style="width: 100%; height: 100%;">
                    <ion-avatar class="profile-picture">
                      <ion-img [src]="userProfile.profileImage">
                      </ion-img>
                      <ion-icon (click)="selectImageSource()" color="success" class="camera-button" name="camera">
                      </ion-icon>
                    </ion-avatar>
                  </div>
                </ion-col>
              </ion-row>
            </ion-grid>

            <div>
              <ion-item *ngIf="!editingName">
                <ion-icon slot="start" name="person"></ion-icon>
                <ion-label>{{ userProfile.name }}</ion-label>
                <ion-icon slot="end" name="create" (click)="editingName = !editingName;"></ion-icon>
              </ion-item>
            </div>

            <div *ngIf="editingName">
              <ion-item>
                <ion-icon slot="start" name="person"></ion-icon>
                <ion-icon *ngIf="userInfoFormGroup.valid && userInfoFormGroup.dirty" slot="end" name="checkmark"
                  (click)="updateUserDisplayName()"></ion-icon>
                <ion-icon slot="end" name="close"
                  (click)="editingName = !editingName; userInfoFormGroup.get('name').reset(); userInfoFormGroup.get('name').markAsUntouched();">
                </ion-icon>
                <ion-input [autofocus]="editingName" placeholder="Enter Full Name" formControlName="name" type="text">
                </ion-input>
              </ion-item>

              <div *ngFor="let validation of validationMessages.name" class="validation-errors">
                <ion-item class="error-message" *ngIf="isError('name', validation.type)">
                  <ion-icon name="alert"></ion-icon>
                  <ion-label>{{ validation.message }}</ion-label>
                </ion-item>
              </div>
            </div>

            <div>
              <ion-item>
                <ion-icon slot="start" name="mail"></ion-icon>
                <ion-label>{{ userProfile.email }}</ion-label>
              </ion-item>
            </div>

          </div>
        </ion-card-content>
      </ion-card>
    </form>

    <ion-card>
      <ion-card-header>
        <ion-card-subtitle>Summary</ion-card-subtitle>
      </ion-card-header>
      <ion-card-content>

        <div *ngIf="allItems === null || userProfile === null">
          <ion-skeleton-text animated></ion-skeleton-text>
          <ion-skeleton-text animated></ion-skeleton-text>
          <ion-skeleton-text animated></ion-skeleton-text>
        </div>

        <div *ngIf="allItems !== null && userProfile !== null">
          <ion-item>
            <ion-label>
              Total Lent Items
            </ion-label>
            <ion-badge color="danger" slot="end">{{ lentItemsCount }}</ion-badge>
          </ion-item>

          <ion-item>
            <ion-label>
              Total Borrowed Items
            </ion-label>
            <ion-badge color="danger" slot="end">{{ borrowedItemsCount }}</ion-badge>
          </ion-item>

          <ion-item>
            <ion-label>
              Completed Items
            </ion-label>
            <ion-badge color="danger" slot="end">{{ doneItemsCount }}</ion-badge>
          </ion-item>
        </div>
      </ion-card-content>
    </ion-card>

    <ion-card>
      <ion-card-header>
        <ion-card-subtitle>Security</ion-card-subtitle>
      </ion-card-header>
      <ion-card-content>

        <div *ngIf="userProfile === null">
          <ion-skeleton-text animated></ion-skeleton-text>
          <ion-skeleton-text animated></ion-skeleton-text>
          <ion-skeleton-text animated></ion-skeleton-text>
        </div>

        <div *ngIf="userProfile !== null">
          <div>
            <ion-item *ngIf="!userProfile.pin" (click)="confirmPinAction(500)">
              <ion-icon style="color:black" slot="start" name="apps"></ion-icon>
              <ion-label>Set PIN</ion-label>
            </ion-item>
            <ion-item *ngIf="userProfile.pin" (click)="confirmPinAction(501, userProfile.pin)">
              <ion-icon style="color:black" slot="start" name="apps"></ion-icon>
              <ion-label>Change PIN</ion-label>
            </ion-item>
            <ion-item *ngIf="userProfile.pin" (click)="confirmPinAction(503, userProfile.pin)">
              <ion-icon style="color:red" slot="start" name="apps"></ion-icon>
              <ion-label>Remove PIN</ion-label>
            </ion-item>
          </div>
        </div>
      </ion-card-content>
    </ion-card>

    <ion-button *ngIf="userProfile !== null" (click)="confirmLogOut()" class="expand-button"
      style="padding: 0px 8px 0px 8px" color="danger"> Log Out
    </ion-button>
  </div>
</ion-content>
